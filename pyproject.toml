[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scrapper-tool"
version = "3.0.0"
description = "Reusable web-scraping toolkit — Pattern A/B/C/D ladder, TLS-impersonation fallback chain, deterministic fixture-replay testing, and an optional MCP server for LLM agents."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ValeroK" }]
keywords = ["web-scraping", "html-parsing", "anti-bot", "mcp", "llm-agents", "curl-cffi", "extruct"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "curl-cffi>=0.7",
    "selectolax>=0.3.21",
    "extruct>=0.18",
    "pydantic>=2.5",
]

[project.optional-dependencies]
# Scrapling 0.4+ splits browser/fetcher deps into a [fetchers] extra
# (msgspec, playwright, patchright, browserforge, …). We pull that
# transitively so ``scrapling.fetchers.StealthyFetcher`` actually loads.
hostile = ["scrapling[fetchers]>=0.3"]
# M13: filled. Provides scrapper-tool-mcp console script (stdio MCP server)
# exposing fetch_with_ladder / extract_product / extract_microdata_price /
# canary tools for LLM agents (Claude Desktop, Claude Code, OpenClaw,
# Hermes Agent, AutoGen, LangChain via mcp-use).
# Capped below 2.0: mcp 2.x renamed ``FastMCP`` to ``MCPServer`` and moved it to
# ``mcp.server.mcpserver``, so ``_build_server``'s import fails outright. The SDK
# says so itself — importing ``mcp.server.fastmcp`` under 2.x raises a
# ModuleNotFoundError whose message recommends pinning ``mcp<2`` to keep v1 code
# running. Migrating is real work (the rename is not the only API change) and does
# not belong in a routine dependency bump.
#
# Watch out when lifting this cap: every MCP test guards on
# ``pytest.importorskip("mcp.server.fastmcp")``, so under 2.x they SKIP rather
# than fail, and the suite goes green against a server that cannot start. That is
# how this nearly shipped unnoticed.
agent = ["mcp>=1.2,<2"]
# M14 (v1.0.0): Pattern E — LLM-driven scraping for any protected site.
# Bundles the default stack: Camoufox (0% headless detection), Patchright
# (fast-mode alternative), Browserforge per-session fingerprints,
# browser-use agent loop, Crawl4AI extract-after-render, langchain-ollama
# for the local LLM bridge. Captcha solver clients (CapSolver / NopeCHA /
# 2Captcha) are HTTP-only and use the existing httpx core dep — no extra
# install. They stay inert unless SCRAPPER_TOOL_CAPTCHA_KEY is set.
llm-agent = [
    "crawl4ai>=0.9",
    "browser-use>=0.13,<0.14",
    # Camoufox v0.4+ refuses to launch without ``geoip2`` because its
    # locale-matching layer queries a MaxMind GeoLite2 db at start.
    # The ``[geoip]`` extra pulls ``geoip2`` + ``maxminddb``. Bare
    # ``camoufox`` lets ``camoufox fetch`` succeed but every browser
    # launch then 500s with ``NotInstalledGeoIPExtra``.
    # v1.6.0: upgraded 0.4 -> 0.5.x. 0.5 adds ``fingerprint_preset`` (real
    # bundled fingerprints, more realistic than generated) and needs Python
    # >=3.10 (we require >=3.12). Upper bound pinned so a 0.6 with a changed
    # AsyncCamoufox kwargs surface can't land silently — the launch-contract
    # test in tests/unit/test_agent_backends.py is the tripwire.
    "camoufox[geoip]>=0.5,<0.6",
    "patchright>=1.49",
    "browserforge>=1.2",
    "pillow>=10",
    # v2.2.0: the slider solver (``agent.backends.captcha_slider``) decodes the
    # GeeTest canvases with pillow and does the gap correlation in numpy. numpy
    # was reaching us only transitively via crawl4ai, so it worked but was never
    # declared — a crawl4ai release that dropped it would have broken slider
    # solving at runtime with an ImportError, and mypy could not resolve it in
    # the lint job (which installs only [dev]). Declared in both places now.
    "numpy>=1.26",
    # NB: browser-use 0.5+ ships its own LLM wrappers
    # (``browser_use.llm.ollama.ChatOllama`` / ``.openai.ChatOpenAI`` /
    # etc.) so we don't pin langchain-ollama or langchain-openai
    # explicitly. browser-use brings whichever OpenAI / Ollama client it
    # needs as a transitive dep.
]
# Theyka/Turnstile-Solver — Tier 1 of the captcha cascade (free OSS).
# Available on PyPI as the `turnstile-solver` package (current 0.1.x).
turnstile-solver = ["turnstile-solver>=0.1.4"]
# Browser-cookie extraction for `scrapper-tool cookies export`. rookiepy is MIT.
#
# NB: browser_cookie3 is the other library in this space and is **LGPL**. It is
# deliberately never declared here and never enters uv.lock; the code will use it
# if a user already has it installed, discovered via find_spec. There is a
# regression test asserting it appears in no dependency list.
#
# Python support, re-checked against PyPI 2026-08-07: rookiepy 0.5.6 publishes
# version-specific wheels (cp37..cp312 plus pp37..pp310), NOT abi3, plus an
# sdist. This project requires >=3.12, so 3.12 installs from a wheel while 3.13
# and 3.14 fall back to building the Rust extension from source and need a
# toolchain. That is why `cookies` is NOT in the CI test matrix — adding it
# would break two of the three rows. The unit tests inject a fake backend into
# sys.modules instead, so coverage of the cookie logic never depends on the
# extra being installable.
#
# Nobody has to compile anything, though. Extraction is a one-shot host-side
# step and the jar it writes is plain JSON, so the extractor and the cascade do
# not need to share an interpreter: install this extra in a 3.12 environment,
# run `cookies export` there, and `load_cookies()` reads the result from 3.13 or
# 3.14. Verified end to end. (browser_cookie3 is pure-Python and needs no
# toolchain at all, but see the LGPL note above — that is the user's call to
# make, not ours to declare.)
cookies = ["rookiepy>=0.5.6"]
# Pattern D (Scrapling) + Pattern E (Crawl4AI) in one environment.
# Requires the lxml override declared in [tool.uv]. Both libraries
# declare conservative lxml pins (Crawl4AI ~=5.3, Scrapling >=6.0.2)
# but actually use the stable HTML/XPath surface that's compatible
# across lxml 5/6. When you use this extra, uv overrides both pins to
# install lxml>=6.0.3 and resolves cleanly. This is the recommended
# install for SDK use and is what the bundled Dockerfile installs.
full = [
    "scrapper-tool[hostile]",
    "scrapper-tool[llm-agent]",
    "scrapper-tool[turnstile-solver]",
]
# M15 (v1.1.0): HTTP REST sidecar — exposes the full A-E capability stack
# over plain JSON/HTTP for service-to-service callers (affiliate-service,
# Node/Go backends, etc.). Provides scrapper-tool-serve console script that
# starts a FastAPI server on port 5792 by default. The /scrape endpoint
# auto-escalates A/B/C → D → E1 → E2 server-side so callers don't need
# per-pattern logic. See docs/http-sidecar.md for full reference.
http = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "PyYAML>=6.0",                # used by scripts/dump_openapi.py for openapi.yaml
    "prometheus-client>=0.20",    # v1.4.0 — /metrics endpoint
]
# NOTE: zendriver-backend / botasaurus-backend extras removed in v1.5.0.
# Both backends returned playwright_browser=None, so agent_browse raised
# AgentError at runtime for them — they were never drivable via Pattern E.
# The lightweight/CDP niche they aimed at is now filled by the Obscura
# backend (connect-over-CDP, returns a real Playwright browser).
# NOTE: skyvern-backend extra removed in v1.1.1.
# skyvern's transitive litellm pin pulled three CVE-affected versions
# (SQL injection / SSTI / RCE in /prompts/test, fixed in litellm 1.83.7),
# but skyvern 1.0.32+ has an internally inconsistent dep tree
# (requires litellm>=1.83.7 AND jsonschema>=4.25.1, while litellm>=1.83.7
# pins jsonschema==4.23.0). The extra was already declared conflicting
# with [full] and was never bundled in any published Docker image or
# recommended SDK install, so removing it has no consumer impact.
# Add back when upstream skyvern resolves the conflict.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.9",
    "mypy>=1.13",
    "pip-audit>=2.7",
    # Not test tooling — needed so `mypy --strict src/` can resolve the slider
    # solver's numpy usage (the lint job installs only [dev]) and so
    # tests/unit/test_captcha_slider.py runs on a bare `--extra dev` sync
    # instead of dying on an import. Also declared in [llm-agent], which is
    # where it is a genuine runtime dependency.
    "numpy>=1.26",
    "pillow>=10",
]

[project.scripts]
scrapper-tool = "scrapper_tool.cli:main"
scrapper-tool-mcp = "scrapper_tool.mcp:main"
scrapper-tool-serve = "scrapper_tool.http_server:main"

# Verify the console scripts are wired:
#     pip install -e .                  # canary CLI
#     scrapper-tool canary https://example.com
#     pip install -e .[agent]           # MCP server
#     scrapper-tool-mcp                 # starts stdio MCP server

[project.urls]
Homepage = "https://github.com/ValeroK/scrapper-tool"
Repository = "https://github.com/ValeroK/scrapper-tool"
Issues = "https://github.com/ValeroK/scrapper-tool/issues"
Changelog = "https://github.com/ValeroK/scrapper-tool/blob/main/CHANGELOG.md"

[tool.uv]
# NOTE: `prerelease = "allow"` used to live here, added when Crawl4AI's latest
# line was pre-release only. Crawl4AI has shipped stable releases since, and the
# global allow had become actively harmful: a `uv lock --upgrade` quietly dragged
# the whole tree onto alphas (lxml 7.0.0a3, pydantic 2.14.0a1, curl-cffi 0.16.0b1,
# mcp 2.0.0b2). If a single dependency ever genuinely needs a pre-release again,
# name that version in its own requirement rather than reopening this globally.

# Override transitive lxml constraints so [hostile] and [llm-agent] can
# coexist via the [full] extra. Crawl4AI declares ``lxml~=5.3`` and
# Scrapling declares ``lxml>=6.0.2`` — both are conservative pins and
# the actual HTML/XPath APIs they use are stable across lxml 5/6. The
# override forces lxml>=6 (newer is generally more compatible) and
# tests confirm both libraries function. If a future Crawl4AI release
# starts depending on lxml-5-only API, install [hostile] and [llm-agent]
# in separate environments instead of using [full].
override-dependencies = [
    "lxml>=6.0.3",
    "pip>=26.1.2",
    # browser-use 0.13 pins ``typing-extensions==4.15.0`` exactly. Honouring
    # that exact pin drags scrapling 0.4.9 -> 0.4.6 and patchright 1.60 -> 1.58
    # backwards, i.e. Pattern D and a browser backend regress so the E2 agent
    # can have one specific typing-extensions build. typing-extensions is
    # additive by design, so the override lets all three stay current; the
    # backend launch-contract tests are the tripwire if that stops being true.
    "typing-extensions>=4.16",
    # browser-use 0.13 also pins ``pypdf==6.10.2`` exactly, which carries four
    # CVEs (CVE-2026-59935/6/7/8) that pip-audit fails the build on. 6.14.2 fixes
    # all four and is a patch-level bump over 6.10 (pypdf is used only for
    # browser-use's optional PDF reading), so the override is safe and keeps CI's
    # dependency-audit gate green.
    "pypdf>=6.14.2",
    # Same story for pillow: browser-use pins ``pillow==12.2.0`` exactly, which
    # carries PYSEC-2026-3493/3494. 12.3.0 is a patch fix. Our own extra already
    # declares ``pillow>=10``, so this only overrides browser-use's exact pin.
    "pillow>=12.3",
    # browser-use's exact pins also drag in CVE-affected click and mcp:
    #   click==8.3.1  -> PYSEC-2026-2132        (fixed 8.3.3)
    #   mcp==1.26.0   -> PYSEC-2026-3481/2/3    (fixed 1.27.2/1.28.1)
    # Both fixed versions satisfy every other constraint (scrapling wants
    # click>=8.3.0 and mcp>=1.27.0), and mcp is our own direct dep, so bumping
    # it forward is squarely intended.
    "click>=8.3.3",
    # NB the upper bound is repeated here on purpose. ``override-dependencies``
    # *replaces* a package's requirements outright rather than intersecting with
    # them, so a bare ``mcp>=1.28.1`` here silently defeated the ``<2`` cap on the
    # ``[agent]`` extra and resolved mcp 2.x — which cannot import FastMCP. Any
    # bound that matters has to appear in both places.
    "mcp>=1.28.1,<2",
    # ...and aiohttp: browser-use pins ``aiohttp==3.13.4`` (PYSEC-2026-2105..2108);
    # 3.14.1 fixes all four and stays under the <4.0 cap every other consumer sets.
    "aiohttp>=3.14.1",
]

# When NOT using the [full] extra, ``[hostile]`` and ``[llm-agent]``
# stay separate. Declaring the extras as conflicting tells uv to lock
# them independently when [full] isn't requested.
conflicts = [
    [
        { extra = "hostile" },
        { extra = "llm-agent" },
    ],
]

[tool.hatch.build.targets.wheel]
packages = ["src/scrapper_tool"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "docs/",
    "skills/",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle / pyflakes
    "I",                  # isort
    "B",                  # bugbear
    "UP",                 # pyupgrade
    "SIM",                # simplify
    "RUF",                # ruff-native
    "TC",                 # type-checking
    "TID",                # tidy-imports
    "PL",                 # pylint subset
    "ASYNC",              # asyncio anti-patterns
    "S",                  # security (bandit)
]
ignore = [
    "S101",  # asserts in tests are fine
    "PLR0913",  # too-many-arguments — config functions need them
    # Positional sibling of PLR0913, added to the PL set by ruff 0.16. Every hit
    # is an MCP tool signature, where the parameter list *is* the published
    # schema an LLM calls — FastMCP invokes them by keyword, and shortening them
    # would mean shrinking the tool surface. Same reason PLR0913 is ignored.
    "PLR0917",  # too-many-positional-arguments
]

[tool.ruff.lint.per-file-ignores]
# Tests do legitimate lazy-imports inside test bodies (to monkeypatch
# modules that haven't been loaded yet) and use mutable class-level
# state for fake-object registries. These are intentional, not smells.
"tests/**" = [
    "S",        # bandit security rules — fine inside tests
    "PLR2004",  # magic values — fine inside assertions
    "PLC0415",  # inline imports — needed for module-mocking
    "RUF012",   # mutable class defaults — fakes use class-level state
    "TC002",    # typing-only third-party imports — pytest in tests
    "SIM117",
    "PLW2901",  # redefined-loop-name — fine in test scoping
    "ASYNC109", # tests stub asyncio.wait_for whose signature has `timeout`
    "E501",     # tests can have long fixture lines for clarity
]
# Operator-runnable E2E scripts: same relaxed rules as tests, plus a
# few of their own (long log strings, ad-hoc assertions, non-crypto rng).
"scripts/**" = [
    "S",
    "PLR2004",
    "PLC0415",
    "PLR0915",  # main() functions narrate sequentially
    "RUF012",
    "TC002",
    "SIM117",
    "RUF100",   # noqa drift across versions OK
    "BLE001",   # broad-except is intentional in error-taxonomy probes
    "ASYNC109",
    "E501",
    "T201",     # print() is the API
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "curl_cffi.*",
    "selectolax.*",
    "extruct.*",
    "scrapling.*",
    "structlog.*",
    "mcp.*",
    "crawl4ai.*",
    "browser_use.*",
    "patchright.*",
    # playwright is pulled only by the [full]/[llm-agent] extras (via scrapling
    # + crawl4ai), not by [dev] — the extra the CI lint job installs — so mypy
    # there can't find its stubs. The Obscura backend imports it lazily.
    "playwright.*",
    # Same story as playwright: geoip2 arrives via camoufox[geoip] under the
    # [llm-agent] extra, so the dev-only lint env has no stubs for it. _extras
    # imports it inside a function purely to probe whether Camoufox will be
    # able to launch at all.
    "geoip2.*",
    # rookiepy is the optional [cookies] backend and browser_cookie3 is never a
    # declared dependency at all (LGPL — used only if the user already has it),
    # so neither is present in the lint env by construction.
    "rookiepy.*",
    "browser_cookie3.*",
    "camoufox.*",
    "browserforge.*",
    "langchain_ollama.*",
    "langchain_openai.*",
    "turnstile_solver.*",
    "PIL.*",
    "fastapi.*",
    "uvicorn.*",
    "yaml.*",
    "prometheus_client.*",
]
ignore_missing_imports = true

# FastMCP's @server.tool(...) decorator has no type stubs, so every
# decorated function shows up as "untyped" under --strict. Suppress that
# *only* for the MCP module — everywhere else strict typing stays in
# force.
[[tool.mypy.overrides]]
module = "scrapper_tool.mcp"
disable_error_code = ["untyped-decorator"]

# The agent layer wraps two heavy frameworks (browser-use, Crawl4AI)
# whose APIs use untyped decorators / dynamic kwargs. Strict typing
# stays on for the rest of the agent surface.
[[tool.mypy.overrides]]
module = ["scrapper_tool.agent.browse", "scrapper_tool.agent.extract"]
disable_error_code = ["untyped-decorator", "no-any-return"]

# FastAPI's @app.get / @app.post / @app.exception_handler decorators
# are untyped under --strict. Suppress *only* for the http_server module.
[[tool.mypy.overrides]]
module = "scrapper_tool.http_server"
disable_error_code = ["untyped-decorator", "no-any-return"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that hit the live internet (skipped by default in CI; opt in with -m live)",
    "agent: Pattern E LLM-agent tests requiring a local LLM (Ollama). Combined with `live` for end-to-end probes; opt in with SCRAPPER_TOOL_AGENT=1.",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m", "not live",
]

[tool.coverage.run]
source = ["src/scrapper_tool"]
branch = true

[tool.coverage.report]
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
