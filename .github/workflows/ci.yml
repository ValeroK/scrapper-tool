name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # The patched-Firefox build the browser-backed tests run against.
  #
  # This is the one input uv.lock cannot reach. `uv sync` pins camoufox==0.5.4,
  # but that is the 1.3 MB Python package; the ~490 MB browser it drives is
  # fetched separately at launch, and which build that is was never declared
  # anywhere in this repo. Commit bcda42e was green on 2026-08-15 and fails
  # today with no code change, so something outside the repo moved; the browser
  # is the largest undeclared candidate, whether or not it turns out to be the
  # culprit here.
  #
  # Pinned here so the browser is a declared dependency like any other and
  # moving it is a reviewable edit rather than a silent Tuesday. beta.28 is the
  # build docs/research/2026-camoufox-obscura-capabilities.md records as
  # validated, and is what a fresh install resolves to today.
  #
  # NB: this pin is for determinism, not a diagnosis. It is NOT known to fix
  # the aws-waf `gokuProps` failure - see the CHANGELOG note under Unreleased.
  CAMOUFOX_BUILD: 152.0.4-beta.28

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type:
    name: Lint + type-check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff lint
        run: uv run ruff check src/ tests/ scripts/
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ scripts/
      - name: Mypy --strict
        run: uv run mypy src/

  test:
    name: Tests (py${{ matrix.python-version }}, extras=${{ matrix.extras }})
    needs: [lint-and-type]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Trimmed to just the [full,agent,http] combo on every supported
        # Python (3.12/3.13/3.14). This row exercises the lxml-override
        # path used by the published Docker image and recommended SDK
        # install — it's the row regressions are most likely to surface
        # in, and it's also the only row that hits the 85% coverage
        # floor (lighter rows like `dev,agent,http` skip the heavy agent
        # test files via importorskip, leaving Pattern E backend code
        # paths uncovered).
        #
        # If you specifically need to verify a la carte extras (e.g.
        # `[hostile]` alone, `[llm-agent]` alone), run pytest locally
        # with that combo. The CI matrix prioritises ship-blocking
        # signal over à la carte regression coverage.
        python-version: ["3.12", "3.13", "3.14"]
        extras: ["dev,full,agent,http"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra ${{ matrix.extras }}
        # Note: when extras includes `hostile`, the `[hostile]` extra
        # pulls Scrapling + Playwright; tests that exercise it still
        # mock the Playwright session rather than launch a real browser.
      # Keyed on the build, so a pin bump misses the cache and re-downloads
      # exactly once instead of silently serving the old browser.
      - name: Cache the Camoufox browser build
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ env.CAMOUFOX_BUILD }}
      # `set` rather than `fetch`: fetch installs a build, set installs it AND
      # makes it active, and AsyncCamoufox launches whatever is active.
      #
      # `sync` first, and then verify. The first version of this step ran `set`
      # alone: it printed "No repo cache found. Run 'camoufox sync' first",
      # exited 0, and the job went green having pinned nothing at all. A pin
      # that can no-op silently is worse than no pin, because it also stops
      # anyone looking. The grep is what makes this step honest.
      - name: Pin the Camoufox browser build
        run: |
          uv run camoufox sync
          uv run camoufox set "official/stable/$CAMOUFOX_BUILD"
          # `set` only records the pin - it prints "(not fetched)" and leaves
          # the download to launch time. Without a fetch the cache step above
          # has nothing to cache and every job still pulls ~490 MB mid-test.
          #
          # The version is repeated on purpose. Bare `camoufox fetch` installs
          # "the active version", but it re-resolves the `official/stable`
          # channel to its newest build and makes THAT active - it overrode the
          # pin one line above it and made beta.29 active. Naming the build
          # here is what makes the pin hold.
          uv run camoufox fetch "official/stable/$CAMOUFOX_BUILD"
          active=$(uv run camoufox active)
          echo "active browser build: $active"
          case "$active" in
            *"$CAMOUFOX_BUILD"*) ;;
            *) echo "::error::pin did not take: wanted $CAMOUFOX_BUILD, active is $active"; exit 1 ;;
          esac
      - name: Run tests with coverage
        # xml alongside term-missing: the Codecov step below uploads a report
        # file, and term-missing writes only to the log. Without this there is
        # nothing on disk for it to find, so the upload silently no-ops even
        # when it runs.
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Upload coverage to Codecov (informational)
        # Keyed on the Python version alone, deliberately. This used to also
        # require `matrix.extras == 'dev,agent,http'`, a value the matrix
        # stopped producing when it was trimmed to `dev,full,agent,http` -- so
        # the condition was never true and coverage was never uploaded, quietly,
        # for as long as it took someone to read the file. A gate that names a
        # matrix value breaks the next time that value is edited; there is one
        # extras row now, and if a second is ever added this should pick the
        # row explicitly rather than resurrect the same trap.
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  hermeticity:
    name: Hermeticity (tests/unit reach no network tier)
    needs: [lint-and-type]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      # Deliberately a light sync. The probe replaces the tier entry points
      # themselves, so it does not need Scrapling or Crawl4AI installed to
      # prove nothing reaches them — which is the point, since the leak it
      # guards against was a test whose hermeticity depended on exactly that.
      - run: uv sync --extra dev --extra agent --extra http
      # tests/unit is "fast, hermetic, no network" per tests/conftest.py. This
      # job is what makes that a claim the suite can fail rather than a comment.
      # A test that reaches Pattern D, the render tier, E1, or E2 without
      # faking it first fails the run and is named in the summary, even if
      # every assertion in it passed.
      - name: Unit suite with the tier probe armed
        env:
          SCRAPPER_TOOL_TIER_PROBE: "1"
        run: uv run pytest tests/unit -q

  pip-audit:
    name: Dependency audit
    needs: [lint-and-type]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv python install 3.13
      # `--all-extras` won't work: `[hostile]` and `[llm-agent]` are declared
      # as conflicting in pyproject.toml so each can lock independently; the
      # supported "everything" combo is `[full,agent,dev]` (which uses the
      # uv lxml override), matching the published Docker image and recommended
      # SDK install path.
      - run: uv sync --extra full --extra agent --extra dev
      # pip itself is not a dependency of this project — it is seeded into the
      # venv by the toolchain and then audited along with everything else. The
      # 2026-08 advisory PYSEC-2026-3721 (pip < 26.2) failed the build for a
      # package that never reaches a consumer of this library. Upgrading is the
      # real remediation and, unlike --ignore-vuln, it does not go stale or
      # silence the next pip advisory.
      - name: Upgrade the seeded pip past known advisories
        run: uv pip install --upgrade pip
      - name: pip-audit
        # --skip-editable: don't try to look up the local package on PyPI.
        # NOTE: --strict is incompatible with --skip-editable in current
        # pip-audit (treats the editable install itself as a hard error).
        # Without --strict, pip-audit still exits non-zero on actual
        # CVE findings — the warning behaviour we trade away is for
        # "package not found on PyPI" cases, which is what we want.
        run: uv run pip-audit --skip-editable
        continue-on-error: false   # fail the build on any new CVE

  mcp-tool-surface-check:
    name: MCP tool surface is up-to-date
    needs: [lint-and-type]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv python install 3.13
      - run: uv sync --extra dev --extra agent --extra full --extra http
      # The MCP counterpart of openapi-spec-check. Regenerate the tool
      # snapshot; if it differs from what's committed, the working tree
      # is dirty and `git diff --exit-code` fails. Without this, tools
      # could be added or removed while the docs, the instructions=
      # string, and the e2e scripts all stayed behind - which is exactly
      # what happened to map_site and crawl_site.
      - run: uv run python scripts/dump_mcp_tools.py
      - name: Fail if tool surface drifted
        run: |
          if ! git diff --exit-code docs/mcp-tools.json; then
            echo "::error::MCP tool surface drifted. Run: uv run python scripts/dump_mcp_tools.py and commit docs/mcp-tools.json."
            exit 1
          fi

  openapi-spec-check:
    name: OpenAPI spec is up-to-date
    needs: [lint-and-type]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv python install 3.13
      - run: uv sync --extra dev --extra agent --extra full --extra http
      # Regenerate the spec; if it differs from what's committed, the
      # working tree will be dirty and `git diff --exit-code` fails.
      - run: uv run python scripts/dump_openapi.py
      - name: Fail if spec drifted
        run: |
          if ! git diff --exit-code docs/openapi/; then
            echo "::error::OpenAPI spec drifted. Run: uv run python scripts/dump_openapi.py and commit docs/openapi/."
            exit 1
          fi
