name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type:
    name: Lint + type-check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff lint
        run: uv run ruff check src/ tests/
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/
      - name: Mypy --strict
        run: uv run mypy src/

  test:
    name: Tests (py${{ matrix.python-version }}, extras=${{ matrix.extras }})
    needs: [lint-and-type]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Trimmed to just the [full,agent,http] combo on every supported
        # Python (3.12/3.13/3.14). This row exercises the lxml-override
        # path used by the published Docker image and recommended SDK
        # install — it's the row regressions are most likely to surface
        # in, and it's also the only row that hits the 85% coverage
        # floor (lighter rows like `dev,agent,http` skip the heavy agent
        # test files via importorskip, leaving Pattern E backend code
        # paths uncovered).
        #
        # If you specifically need to verify a la carte extras (e.g.
        # `[hostile]` alone, `[llm-agent]` alone), run pytest locally
        # with that combo. The CI matrix prioritises ship-blocking
        # signal over à la carte regression coverage.
        python-version: ["3.12", "3.13", "3.14"]
        extras: ["dev,full,agent,http"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra ${{ matrix.extras }}
        # Note: when extras includes `hostile`, the `[hostile]` extra
        # pulls Scrapling + Playwright; tests that exercise it still
        # mock the Playwright session rather than launch a real browser.
      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=85
      - name: Upload coverage to Codecov (informational)
        if: matrix.python-version == '3.13' && matrix.extras == 'dev,agent,http'
        uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: false

  hermeticity:
    name: Hermeticity (tests/unit reach no network tier)
    needs: [lint-and-type]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      # Deliberately a light sync. The probe replaces the tier entry points
      # themselves, so it does not need Scrapling or Crawl4AI installed to
      # prove nothing reaches them — which is the point, since the leak it
      # guards against was a test whose hermeticity depended on exactly that.
      - run: uv sync --extra dev --extra agent --extra http
      # tests/unit is "fast, hermetic, no network" per tests/conftest.py. This
      # job is what makes that a claim the suite can fail rather than a comment.
      # A test that reaches Pattern D, the render tier, E1, or E2 without
      # faking it first fails the run and is named in the summary, even if
      # every assertion in it passed.
      - name: Unit suite with the tier probe armed
        env:
          SCRAPPER_TOOL_TIER_PROBE: "1"
        run: uv run pytest tests/unit -q

  pip-audit:
    name: Dependency audit
    needs: [lint-and-type]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv python install 3.13
      # `--all-extras` won't work: `[hostile]` and `[llm-agent]` are declared
      # as conflicting in pyproject.toml so each can lock independently; the
      # supported "everything" combo is `[full,agent,dev]` (which uses the
      # uv lxml override), matching the published Docker image and recommended
      # SDK install path.
      - run: uv sync --extra full --extra agent --extra dev
      - name: pip-audit
        # --skip-editable: don't try to look up the local package on PyPI.
        # NOTE: --strict is incompatible with --skip-editable in current
        # pip-audit (treats the editable install itself as a hard error).
        # Without --strict, pip-audit still exits non-zero on actual
        # CVE findings — the warning behaviour we trade away is for
        # "package not found on PyPI" cases, which is what we want.
        run: uv run pip-audit --skip-editable
        continue-on-error: false   # fail the build on any new CVE

  openapi-spec-check:
    name: OpenAPI spec is up-to-date
    needs: [lint-and-type]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv python install 3.13
      - run: uv sync --extra dev --extra agent --extra full --extra http
      # Regenerate the spec; if it differs from what's committed, the
      # working tree will be dirty and `git diff --exit-code` fails.
      - run: uv run python scripts/dump_openapi.py
      - name: Fail if spec drifted
        run: |
          if ! git diff --exit-code docs/openapi/; then
            echo "::error::OpenAPI spec drifted. Run: uv run python scripts/dump_openapi.py and commit docs/openapi/."
            exit 1
          fi
