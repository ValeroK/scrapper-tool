openapi: 3.1.0
info:
  title: scrapper-tool REST sidecar
  description: "REST sidecar for scrapper-tool. Exposes the full A-E capability stack\
    \ over plain JSON/HTTP. The /scrape endpoint runs the full A/B/C \u2192 D \u2192\
    \ E1 \u2192 E2 auto-escalation ladder server-side so callers don't need per-pattern\
    \ logic. Pattern D (Scrapling) is invoked when the [hostile] extra is installed;\
    \ skipped otherwise (cascade falls through to E1)."
  version: 1.4.4
paths:
  /health:
    get:
      tags:
      - operational
      summary: Liveness probe
      description: Always returns 200 if the process is up. Use for orchestrator liveness.
      operationId: health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health
  /version:
    get:
      tags:
      - operational
      summary: Version + installed-extras info
      operationId: version
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Version
  /ready:
    get:
      tags:
      - operational
      summary: Readiness with detailed component checks
      description: Returns ready / degraded / not_ready in body (always HTTP 200).
        Body distinguishes 'sidecar crashed' (no response) from 'sidecar up but LLM
        unavailable' (degraded).
      operationId: ready
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Ready
  /metrics:
    get:
      tags:
      - operational
      summary: Prometheus exposition (v1.4.0+)
      description: 'Standard Prometheus text-format exposition. Counters: ``scrapper_pattern_used_total``,
        ``scrapper_responses_structured_total``, ``scrapper_responses_unstructured_total``,
        ``scrapper_user_data_dir_reused_total``. Histograms: ``scrapper_pattern_duration_seconds``
        (per step+outcome), ``scrapper_cascade_steps`` (per request). Returns 503
        when ``prometheus-client`` isn''t installed (older [http] extras).'
      operationId: metrics
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /fetch:
    post:
      tags:
      - scraping
      summary: "Pattern A/B/C \u2014 TLS-impersonation ladder fetch"
      description: Walks the impersonation ladder (chrome133a / chrome124 / safari18_0
        / firefox135) until a profile returns non-403/503. With extract_structured=true
        (default), also runs Pattern B (extruct JSON-LD / microdata) and Pattern C
        (microdata price).
      operationId: fetch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Fetch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /scrape:
    post:
      tags:
      - scraping
      summary: Auto-escalating scrape (PRIMARY endpoint)
      description: "Runs Pattern A/B/C \u2192 D \u2192 E1 \u2192 E2 in sequence and\
        \ returns the first one that succeeds. Use for 95% of scraping tasks; the\
        \ response includes pattern_used so callers can see which pattern produced\
        \ the data. Pattern D (Scrapling) is invoked between A/B/C and E1 when the\
        \ [hostile] extra is installed; when it isn't, the cascade falls through to\
        \ E1 and the response carries hostile_skipped=true."
      operationId: scrape
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrapeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Scrape
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /extract:
    post:
      tags:
      - agent
      summary: "Pattern E1 \u2014 Crawl4AI + LLM extraction (1 LLM call)"
      description: Renders the URL with a stealth browser, then makes a single LLM
        call to extract structured JSON matching schema_json. Faster and more reliable
        than /browse for non-interactive pages. Requires the [llm-agent] extra.
      operationId: extract
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Extract
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /browse:
    post:
      tags:
      - agent
      summary: "Pattern E2 \u2014 browser-use multi-step agent loop"
      description: Multi-step LLM-driven agent loop. Use ONLY for interactive flows
        (login, paginate, dynamic forms). Slower and more expensive than /extract.
        Requires the [llm-agent] extra.
      operationId: browse
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowseRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Browse
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
components:
  schemas:
    BrowseRequest:
      properties:
        url:
          type: string
          title: Url
        instruction:
          type: string
          title: Instruction
        schema_json:
          anyOf:
          - additionalProperties: true
            type: object
          - items: {}
            type: array
          - type: 'null'
          title: Schema Json
        browser:
          anyOf:
          - type: string
          - type: 'null'
          title: Browser
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        max_steps:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Steps
        timeout_s:
          anyOf:
          - type: number
          - type: 'null'
          title: Timeout S
        headful:
          type: boolean
          title: Headful
          default: false
      type: object
      required:
      - url
      - instruction
      title: BrowseRequest
      description: Body of POST /browse.
    ExtractRequest:
      properties:
        url:
          type: string
          title: Url
        schema_json:
          anyOf:
          - additionalProperties: true
            type: object
          - items: {}
            type: array
          - type: string
          title: Schema Json
        instruction:
          anyOf:
          - type: string
          - type: 'null'
          title: Instruction
        browser:
          anyOf:
          - type: string
          - type: 'null'
          title: Browser
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        timeout_s:
          anyOf:
          - type: number
          - type: 'null'
          title: Timeout S
        headful:
          type: boolean
          title: Headful
          default: false
      type: object
      required:
      - url
      - schema_json
      title: ExtractRequest
      description: Body of POST /extract.
    FetchRequest:
      properties:
        url:
          type: string
          title: Url
          description: Target URL
          examples:
          - https://example.com
        method:
          type: string
          title: Method
          description: HTTP method
          default: GET
        headers:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Headers
          description: Extra request headers
        timeout:
          type: number
          title: Timeout
          description: Per-request timeout (seconds)
          default: 10.0
        proxy:
          anyOf:
          - type: string
          - type: 'null'
          title: Proxy
          description: Optional proxy URL (http://user:pass@host:port)
        extract_structured:
          type: boolean
          title: Extract Structured
          description: Run Pattern B (JSON-LD/microdata) + Pattern C (microdata price)
            on the response HTML. Adds `product`, `json_ld`, `microdata_price` fields.
          default: true
      type: object
      required:
      - url
      title: FetchRequest
      description: Body of POST /fetch.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ScrapeRequest:
      properties:
        url:
          type: string
          title: Url
          description: Target URL
          examples:
          - https://example.com/product/123
        schema_json:
          anyOf:
          - additionalProperties: true
            type: object
          - items: {}
            type: array
          - type: string
          - type: 'null'
          title: Schema Json
          description: What shape to extract. JSON Schema dict, list-of-fields, or
            natural-language string. If None, returns auto-detected ProductOffer from
            JSON-LD/microdata when A/B/C succeeds.
        instruction:
          anyOf:
          - type: string
          - type: 'null'
          title: Instruction
          description: Optional extraction guidance for the LLM
        mode:
          type: string
          enum:
          - auto
          - fetch
          - extract
          - browse
          - hostile
          title: Mode
          description: "auto: full ladder (A/B/C \u2192 D \u2192 E1 \u2192 E2). fetch/extract/browse:\
            \ force a specific pattern (mode=fetch never invokes Pattern D \u2014\
            \ the cheap-path contract is preserved). hostile (NEW v1.2.0): invoke\
            \ Pattern D directly, skipping the A/B/C ladder. On D failure, falls through\
            \ to E1/E2 unless hostile_fallback=false. Use for vendors recon-classified\
            \ as hostile (Cloudflare Turnstile, Akamai EVA, DataDome) where A/B/C\
            \ is known to fail."
          default: auto
        browser:
          anyOf:
          - type: string
          - type: 'null'
          title: Browser
          description: Override SCRAPPER_TOOL_AGENT_BROWSER
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
          description: Override SCRAPPER_TOOL_AGENT_MODEL
        timeout_s:
          anyOf:
          - type: number
          - type: 'null'
          title: Timeout S
          description: Override AgentConfig.timeout_s
        max_steps:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Steps
          description: Override AgentConfig.max_steps (E2 only)
        headful:
          type: boolean
          title: Headful
          description: Run browser headful (debugging)
          default: false
        force_llm_extract:
          type: boolean
          title: Force Llm Extract
          description: 'Pre-v1.1.2 behaviour: with ``mode=auto`` and ``schema_json``
            set, always escalate to E1 even when A/B/C returned a readable page. From
            v1.1.2 the default is to accept A/B/C as success when the page returned
            200 + any structured signal, letting the caller post-process from the
            raw fetch instead of paying for an LLM call. Set ``force_llm_extract=true``
            to opt back in to the old always-escalate behaviour.'
          default: false
        hostile_fallback:
          type: boolean
          title: Hostile Fallback
          description: When mode=hostile and Pattern D fails (extra missing, fetch
            failed, or classifier rejected D's output), control whether the cascade
            falls through to E1/E2 (default true) or surfaces the failure immediately
            (false). Set false on adapters that have already paid the cost of recon
            and want to fail fast rather than silently pay for an LLM call.
          default: true
        pattern_d_network_idle:
          type: boolean
          title: Pattern D Network Idle
          description: When True, Pattern D's Scrapling fetcher waits for the page's
            network to settle before returning HTML. Set this for SPA-rendered hostile
            vendors (Tasca, RevolutionParts dealers with CF, etc.) where the static
            HTML lacks structured signals because results lazy-load via client-side
            JS after CF clearance. Adds ~5-15s of fetch latency. Default False keeps
            cold-call latency low for the common Cloudflare-but-not-SPA case (Amayama,
            Subaru-JP).
          default: false
        solve_cloudflare:
          anyOf:
          - type: boolean
          - type: string
            const: auto
          title: Solve Cloudflare
          description: 'Pattern D''s Cloudflare-solve behavior (NEW v1.4.0). ``auto``
            (default): probe first without the solver; redo with solver only when
            a CF challenge body is detected. Saves ~10s on vendors that don''t gate
            behind CF. ``True``: always run the solver on the first fetch (pre-1.4.0
            behavior; explicit when caller knows the vendor always serves a CF challenge).
            ``False``: never run the solver; D fetches once unprotected.'
          default: auto
        persist_browser_profile_dir:
          anyOf:
          - type: string
          - type: 'null'
          title: Persist Browser Profile Dir
          description: "Optional absolute path to a persistent browser profile dir\
            \ (NEW v1.3.0). When set, Pattern D and any E1/E2 escalation step share\
            \ this dir, so Cloudflare clearance cookies (cf_clearance) persist across\
            \ requests. Caller is responsible for: (1) per-vendor isolation (use a\
            \ different dir per host so clearance state doesn't leak between targets),\
            \ (2) periodic cleanup to avoid Cloudflare's stale-profile detection (~30\
            \ min TTL is a safe default \u2014 rotate via cron or the consumer's own\
            \ scheduler). When unset (default), the cascade creates an ephemeral per-request\
            \ dir, shares it across D + E1 + E2, and deletes it on every exit path.\
            \ Use this field only when you want cross-request reuse \u2014 the per-cascade\
            \ default already eliminates the redundant CF challenges that caused E-tier\
            \ escalations to fresh-fight already-bypassed sites."
      type: object
      required:
      - url
      title: ScrapeRequest
      description: Body of POST /scrape (the primary endpoint).
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
